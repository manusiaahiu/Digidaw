<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Digidaw</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --pn: #fff;
        --bd: #e6e8ef;
        --tx: #1f2430;
        --mu: #7a8194;
        --ac: #3b82f6;
        --hv: #e8f0ff;
        --sh: 0 4px 18px #1f243014;
        --cv: #f7f8fb;
        --dot: #cdd3df;
        --ink: #1f2937;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #16171b;
          --pn: #23252b;
          --bd: #32353d;
          --tx: #eceef2;
          --mu: #99a0ae;
          --hv: #1e2a44;
          --sh: 0 4px 18px #0006;
          --cv: #14151a;
          --dot: #2c2f38;
          --ink: #e6e8ee;
        }
      }
      :root[data-theme="dark"] {
        --bg: #16171b;
        --pn: #23252b;
        --bd: #32353d;
        --tx: #eceef2;
        --mu: #99a0ae;
        --hv: #1e2a44;
        --sh: 0 4px 18px #0006;
        --cv: #14151a;
        --dot: #2c2f38;
        --ink: #e6e8ee;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          13px/1.4 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        background: var(--pn);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background: var(--hv);
        border-color: var(--ac);
      }
      button.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      #cw {
        position: absolute;
        inset: 0;
      }
      #cv {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--cv);
        touch-action: none;
      }
      .fl {
        position: absolute;
        background: var(--pn);
        border: 1px solid var(--bd);
        border-radius: 14px;
        box-shadow: var(--sh);
        z-index: 3;
      }
      #top {
        left: 12px;
        top: calc(12px + env(safe-area-inset-top, 0px));
        padding: 8px 14px;
        font-weight: 600;
      }
      #top i {
        color: var(--ac);
        font-style: normal;
      }
      #tr {
        right: 12px;
        top: calc(12px + env(safe-area-inset-top, 0px));
        padding: 6px;
        display: flex;
        gap: 6px;
      }
      #bt {
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        padding: 6px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #bt .v {
        width: 1px;
        height: 22px;
        background: var(--bd);
      }
      #zl {
        min-width: 40px;
        text-align: center;
        color: var(--mu);
      }
      #lp {
        left: 12px;
        top: calc(62px + env(safe-area-inset-top, 0px));
        bottom: calc(72px + env(safe-area-inset-bottom, 0px));
        width: 236px;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 8px;
      }
      #lp .tb {
        display: flex;
        gap: 6px;
      }
      #lp .tb button {
        flex: 1;
      }
      #ps,
      #pv {
        overflow: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #pv[hidden],
      #ps[hidden] {
        display: none;
      }
      input[type="text"],
      input:not([type]),
      textarea,
      input[type="number"] {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px 8px;
        width: 100%;
        box-sizing: border-box;
      }
      h4 {
        margin: 8px 0 2px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mu);
      }
      .sg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      .sb {
        padding: 3px;
        border-radius: 8px;
        border-color: transparent;
        background: none;
        color: var(--tx);
      }
      .sb svg {
        width: 100%;
        display: block;
      }
      #ic {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .ib {
        position: relative;
        aspect-ratio: 1;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .ib img {
        max-width: 80%;
        max-height: 80%;
      }
      .ib i {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--ac);
        color: #fff;
        border-radius: 50%;
        width: 16px;
        height: 16px;
        font-style: normal;
        font-size: 11px;
        text-align: center;
        line-height: 16px;
        display: none;
      }
      .ib:hover i {
        display: block;
      }
      #pp {
        right: 12px;
        top: calc(62px + env(safe-area-inset-top, 0px));
        width: 216px;
        max-height: calc(100% - 150px);
        overflow: auto;
        padding: 10px;
        display: none;
      }
      #pp label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        color: var(--mu);
        font-size: 11px;
        margin-bottom: 6px;
      }
      #pp label.c {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--tx);
      }
      #pp input[type="color"] {
        width: 100%;
        height: 28px;
        padding: 0;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: none;
      }
      .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 6px;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-bottom: 6px;
      }
      .g3 button {
        padding: 6px 2px;
      }
      #hint {
        position: absolute;
        right: 14px;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        color: var(--mu);
        font-size: 11px;
        pointer-events: none;
        text-align: right;
      }
      #ts {
        position: fixed;
        left: 50%;
        bottom: 80px;
        transform: translateX(-50%);
        background: #111827;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        z-index: 9;
      }
      #ts.s {
        opacity: 1;
      }
      .ed {
        position: fixed;
        z-index: 7;
        box-sizing: border-box;
        text-align: center;
        border: 2px solid var(--ac) !important;
        border-radius: 8px;
        background: #fff !important;
        color: #111 !important;
        resize: none;
        padding: 6px;
      }
      #md {
        position: fixed;
        inset: 0;
        background: #0009;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 8;
      }
      #md[hidden] {
        display: none;
      }
      .bx {
        background: var(--pn);
        padding: 16px;
        border-radius: 14px;
        max-width: 92vw;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #stg {
        position: relative;
        display: inline-block;
        cursor: crosshair;
        align-self: center;
        background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0/14px
          14px;
        user-select: none;
      }
      #pi {
        display: block;
        max-width: 80vw;
        max-height: 55vh;
        -webkit-user-drag: none;
      }
      #sr {
        position: absolute;
        border: 2px solid var(--ac);
        background: #3b82f633;
        pointer-events: none;
        display: none;
      }
      .rw {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .rw .sp {
        flex: 1;
      }
      .rw label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .pri {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      select {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 5px;
        color: inherit;
      }
      @media (max-width: 760px) {
        #lp {
          width: 170px;
        }
        #pp {
          width: 170px;
        }
        #hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="cw">
      <svg id="cv">
        <defs>
          <marker
            id="ar"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="10"
            markerHeight="10"
            orient="auto-start-reverse"
            markerUnits="userSpaceOnUse"
          >
            <path d="M0 0L10 5L0 10z" fill="context-stroke" />
          </marker>
          <pattern id="gd" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1.1" style="fill: var(--dot)" />
          </pattern>
        </defs>
        <rect
          id="gr"
          x="-20000"
          y="-20000"
          width="40000"
          height="40000"
          fill="url(#gd)"
        />
        <g id="w"></g>
      </svg>
    </div>
    <div class="fl" id="top"><i>✒</i> Digidaw</div>
    <div class="fl" id="tr">
      <button id="xp">PNG</button><button id="xs">SVG</button
      ><button id="xj">JSON</button><button id="xi">Impor</button
      ><button id="xc">Kosongkan</button><button id="th">◐</button>
    </div>
    <div class="fl" id="lp">
      <button id="up">+ Gambar · Ctrl+V</button>
      <div id="ps">
        <input id="q" placeholder="Cari shape…" />
        <div id="sl"></div>
      </div>
      <div id="pv" hidden>
        <input type="checkbox" id="ltl" />
        <div id="ic"></div>
      </div>
    </div>
    <div class="fl" id="pp"></div>
    <div class="fl" id="bt">
      <button id="t1" class="on" title="V">Pilih</button
      ><button id="t2" title="H">Geser</button
      ><button id="t3" title="C">Konektor</button><span class="v"></span
      ><button id="bu">↶</button><button id="br">↷</button
      ><span class="v"></span><button id="zo">−</button><span id="zl">100%</span
      ><button id="zi">+</button><button id="zf">Fit</button
      ><span class="v"></span><button id="gt" class="on">Grid</button>
    </div>

    <input type="file" id="fj" accept=".json" hidden /><input
      type="file"
      id="fi"
      accept="image/*"
      hidden
    />
    <div id="ts"></div>
    <div id="md" hidden>
      <div class="bx">
        <div style="color: var(--mu)">
          Drag di gambar untuk memilih area (misal satu icon), atau pakai utuh.
        </div>
        <div id="stg">
          <img id="pi" alt="" />
          <div id="sr"></div>
        </div>
        <div class="rw">
          <label><input type="checkbox" id="tr2" /> Transparan-kan putih</label
          ><label><input type="checkbox" id="rr" /> Sudut rounded</label
          ><label><input type="checkbox" id="tl2" /> Bingkai</label>
        </div>
        <div class="rw">
          <span class="sp"></span><button id="bc">Batal</button
          ><button id="bf">Pakai utuh</button
          ><button id="bx" class="pri">Potong area &amp; pakai</button>
        </div>
      </div>
    </div>
    <script>
      const $ = (s) => document.querySelector(s),
        uid = () => "i" + Math.random().toString(36).slice(2, 9);
      const AC = "#3b82f6",
        FS = "Inter,system-ui,-apple-system,Segoe UI,sans-serif",
        svg = $("#cv"),
        W = $("#w");
      let S = { nodes: [], edges: [] },
        sel = [],
        selE = null,
        tool = "sel",
        V = { x: 60, y: 60, k: 1 },
        hist = [],
        fut = [],
        D = null,
        H = null,
        clip = null,
        icons = [],
        st = null,
        GS = true,
        spc = false;
      const nd = (i) => S.nodes.find((n) => n.id == i),
        ed = (i) => S.edges.find((e) => e.id == i);
      const esc = (s) =>
        String(s || "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const hex = (c) => (/^#[0-9a-f]{6}$/i.test(c) ? c : "#ffffff");
      const sn = (v) => (GS ? Math.round(v / 10) * 10 : Math.round(v));
      function toast(m) {
        const t = $("#ts");
        t.textContent = m;
        t.classList.add("s");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => t.classList.remove("s"), 2200);
      }
      function snap() {
        hist.push(JSON.stringify(S));
        if (hist.length > 80) hist.shift();
        fut = [];
      }
      function undo() {
        if (!hist.length) return;
        fut.push(JSON.stringify(S));
        S = JSON.parse(hist.pop());
        sel = [];
        selE = null;
        draw();
        panel();
      }
      function redo() {
        if (!fut.length) return;
        hist.push(JSON.stringify(S));
        S = JSON.parse(fut.pop());
        sel = [];
        selE = null;
        draw();
        panel();
      }
      /* ---------- shape library ---------- */
      const R = (w, h, r) =>
        `M${r} 0H${w - r}A${r} ${r} 0 0 1 ${w} ${r}V${h - r}A${r} ${r} 0 0 1 ${w - r} ${h}H${r}A${r} ${r} 0 0 1 0 ${h - r}V${r}A${r} ${r} 0 0 1 ${r} 0Z`;
      const Pl = (a) => (w, h) => [
        "M" + a.map(([x, y]) => `${x * w} ${y * h}`).join("L") + "Z",
      ];
      const EL = (w, h) =>
        `M0 ${h / 2}A${w / 2} ${h / 2} 0 0 1 ${w} ${h / 2}A${w / 2} ${h / 2} 0 0 1 0 ${h / 2}Z`;
      const RR = (x, y, w, h, r) =>
        `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
      const CI = (cx, cy, r) =>
        `M${cx + r} ${cy}A${r} ${r} 0 0 1 ${cx - r} ${cy}A${r} ${r} 0 0 1 ${cx + r} ${cy}Z`;
      const RP =
        (n, o = -Math.PI / 2) =>
        (w, h) => [
          "M" +
            Array.from({ length: n }, (_, i) => {
              const a = o + (i * 2 * Math.PI) / n;
              return `${w / 2 + (w / 2) * Math.cos(a)} ${h / 2 + (h / 2) * Math.sin(a)}`;
            }).join("L") +
            "Z",
        ];
      const SH = {
        rect: ["Persegi", 140, 60, (w, h) => [`M0 0H${w}V${h}H0Z`]],
        round: ["Rounded", 140, 60, (w, h) => [R(w, h, Math.min(14, h / 2))]],
        term: ["Terminator", 140, 50, (w, h) => [R(w, h, h / 2)]],
        ellipse: ["Elips", 120, 70, (w, h) => [EL(w, h)]],
        diamond: [
          "Decision",
          120,
          80,
          Pl([
            [0.5, 0],
            [1, 0.5],
            [0.5, 1],
            [0, 0.5],
          ]),
        ],
        tri: [
          "Segitiga",
          80,
          70,
          Pl([
            [0.5, 0],
            [1, 1],
            [0, 1],
          ]),
        ],
        hex: [
          "Preparation",
          130,
          60,
          Pl([
            [0.2, 0],
            [0.8, 0],
            [1, 0.5],
            [0.8, 1],
            [0.2, 1],
            [0, 0.5],
          ]),
        ],
        trap: [
          "Trapesium",
          120,
          60,
          Pl([
            [0.15, 0],
            [0.85, 0],
            [1, 1],
            [0, 1],
          ]),
        ],
        para: [
          "Data",
          130,
          60,
          Pl([
            [0.2, 0],
            [1, 0],
            [0.8, 1],
            [0, 1],
          ]),
        ],
        manual: [
          "Manual input",
          120,
          60,
          Pl([
            [0, 0.2],
            [1, 0],
            [1, 1],
            [0, 1],
          ]),
        ],
        offpage: [
          "Off-page",
          60,
          70,
          Pl([
            [0, 0],
            [1, 0],
            [1, 0.7],
            [0.5, 1],
            [0, 0.7],
          ]),
        ],
        cross: [
          "Plus",
          60,
          60,
          Pl([
            [0.33, 0],
            [0.67, 0],
            [0.67, 0.33],
            [1, 0.33],
            [1, 0.67],
            [0.67, 0.67],
            [0.67, 1],
            [0.33, 1],
            [0.33, 0.67],
            [0, 0.67],
            [0, 0.33],
            [0.33, 0.33],
          ]),
        ],
        arrR: [
          "Panah",
          120,
          60,
          Pl([
            [0, 0.25],
            [0.6, 0.25],
            [0.6, 0],
            [1, 0.5],
            [0.6, 1],
            [0.6, 0.75],
            [0, 0.75],
          ]),
        ],
        arr2: [
          "Panah ganda",
          120,
          60,
          Pl([
            [0, 0.5],
            [0.2, 0],
            [0.2, 0.3],
            [0.8, 0.3],
            [0.8, 0],
            [1, 0.5],
            [0.8, 1],
            [0.8, 0.7],
            [0.2, 0.7],
            [0.2, 1],
          ]),
        ],
        step: [
          "Process arrow",
          130,
          60,
          Pl([
            [0, 0],
            [0.8, 0],
            [1, 0.5],
            [0.8, 1],
            [0, 1],
          ]),
        ],
        cube: [
          "Kubus",
          90,
          80,
          (w, h) => {
            const d = Math.min(20, w / 4, h / 4);
            return [
              `M0 ${d}L${d} 0H${w}V${h - d}L${w - d} ${h}H0Z`,
              `M0 ${d}H${w - d}V${h}M${w - d} ${d}L${w} 0`,
            ];
          },
        ],
        cyl: [
          "Database",
          80,
          90,
          (w, h) => {
            const r = Math.min(14, h / 4);
            return [
              `M0 ${r}V${h - r}A${w / 2} ${r} 0 0 0 ${w} ${h - r}V${r}A${w / 2} ${r} 0 0 0 0 ${r}Z`,
              `M0 ${r}A${w / 2} ${r} 0 0 0 ${w} ${r}`,
            ];
          },
        ],
        cloud: [
          "Cloud",
          130,
          80,
          (w, h) => [
            `M${0.25 * w} ${0.8 * h}C${-0.05 * w} ${0.8 * h},${-0.05 * w} ${0.4 * h},${0.2 * w} ${0.4 * h}C${0.15 * w} ${0.1 * h},${0.45 * w} ${0.05 * h},${0.5 * w} ${0.25 * h}C${0.6 * w} ${-0.05 * h},${0.95 * w} ${0.1 * h},${0.8 * w} ${0.4 * h}C${1.05 * w} ${0.4 * h},${1.05 * w} ${0.8 * h},${0.8 * w} ${0.8 * h}Z`,
          ],
        ],
        note: [
          "Catatan",
          100,
          70,
          (w, h) => {
            const f = Math.min(18, w / 4);
            return [`M0 0H${w - f}L${w} ${f}V${h}H0Z`, `M${w - f} 0V${f}H${w}`];
          },
        ],
        callout: [
          "Callout",
          120,
          70,
          (w, h) => [
            `M0 0H${w}V${h * 0.75}H${w * 0.4}L${w * 0.2} ${h}V${h * 0.75}H0Z`,
          ],
        ],
        doc: [
          "Dokumen",
          120,
          70,
          (w, h) => [
            `M0 0H${w}V${h * 0.85}C${w * 0.75} ${h * 0.65},${w * 0.25} ${h * 1.05},0 ${h * 0.85}Z`,
          ],
        ],
        predef: [
          "Predefined",
          130,
          60,
          (w, h) => {
            const a = Math.min(14, w * 0.12);
            return [`M0 0H${w}V${h}H0Z`, `M${a} 0V${h}M${w - a} 0V${h}`];
          },
        ],
        internal: [
          "Internal storage",
          100,
          70,
          (w, h) => [`M0 0H${w}V${h}H0Z`, `M0 14H${w}M14 0V${h}`],
        ],
        delay: [
          "Delay",
          110,
          60,
          (w, h) => [`M0 0H${w / 2}A${w / 2} ${h / 2} 0 0 1 ${w / 2} ${h}H0Z`],
        ],
        display: [
          "Display",
          120,

            snap();
            const e = ed(selE);
            [e.a, e.b, e.pa, e.pb] = [e.b, e.a, e.pb, e.pa];
            if (e.wp) e.wp.reverse();
            draw();
          },
          rb: () => {
            snap();
            const e = ed(selE);
            delete e.bx;
            delete e.by;
            delete e.wp;
            draw();
          },
        })[a]();
      };
      /* ---------- icons + paste ---------- */
      function loadIcons() {
        try {
          icons = JSON.parse(localStorage.getItem("dg-icons") || "[]");
        } catch (e) {
          icons = [];
        }
      }
      function saveIcons() {
        try {
          localStorage.setItem("dg-icons", JSON.stringify(icons));
        } catch (e) {
          toast("Library penuh, icon tidak tersimpan permanen");
        }
        renderIcons();
      }
      function renderIcons() {
        $("#ic").innerHTML = icons
          .map(
            (c, i) =>
              `<div class="ib" data-i="${i}"><img src="${c.src}" alt=""><i data-x="${i}">×</i></div>`,
          )
          .join("");
      }
      $("#ic").onclick = (ev) => {
        if (ev.target.dataset.x != null) {
          icons.splice(+ev.target.dataset.x, 1);
          saveIcons();
          return;
        }
        const b = ev.target.closest(".ib");
        if (b) {
          const c = icons[+b.dataset.i];
          addImg(c.src, c.w, c.h, 72);
          if ($("#ltl").checked) styleImg(nd(sel[0]), 0, 1);
        }
      };
      function openCrop(src) {
        st = { src, r: null };
        $("#pi").src = src;
        $("#sr").style.display = "none";
        $("#md").hidden = false;
      }
      $("#stg").onpointerdown = (ev) => {
        const b = $("#stg").getBoundingClientRect();
        st.d = { x: ev.clientX - b.left, y: ev.clientY - b.top };
        $("#stg").setPointerCapture(ev.pointerId);
      };
      $("#stg").onpointermove = (ev) => {
        if (!st || !st.d) return;
        const b = $("#stg").getBoundingClientRect(),
          cl = (v, m) => Math.max(0, Math.min(m, v)),
          x = cl(ev.clientX - b.left, b.width),
          y = cl(ev.clientY - b.top, b.height),
          r = {
            x: Math.min(x, st.d.x),
            y: Math.min(y, st.d.y),
            w: Math.abs(x - st.d.x),
            h: Math.abs(y - st.d.y),
          };
        st.r = r;
        const s = $("#sr").style;
        s.display = "block";
        s.left = r.x + "px";
        s.top = r.y + "px";
        s.width = r.w + "px";
        s.height = r.h + "px";
      };
      $("#stg").onpointerup = () => {
        if (st) st.d = null;
      };
      function finishCrop(useCrop) {
        const im = $("#pi"),
          k = im.naturalWidth / im.clientWidth,
          r = useCrop && st.r && st.r.w > 4 && st.r.h > 4 ? st.r : null;
        const sx = r ? r.x * k : 0,
          sy = r ? r.y * k : 0,
          sw = r ? r.w * k : im.naturalWidth,
          sh = r ? r.h * k : im.naturalHeight,
          s = Math.min(1, 256 / Math.max(sw, sh)),
          cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(sw * s));
        cv.height = Math.max(1, Math.round(sh * s));
        const x = cv.getContext("2d");
        x.drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
        if ($("#tr2").checked) {
          const d = x.getImageData(0, 0, cv.width, cv.height),
            a = d.data;
          for (let i = 0; i < a.length; i += 4) {
            const m = Math.min(a[i], a[i + 1], a[i + 2]);
            if (m >= 238) a[i + 3] = 0;
            else if (m > 200)
              a[i + 3] = Math.round((a[i + 3] * (238 - m)) / 38);
          }
          x.putImageData(d, 0, 0);
        }
        const src = cv.toDataURL("image/png");
        $("#md").hidden = true;
        addImg(src, cv.width, cv.height, r ? 80 : 360);
        styleImg(nd(sel[0]), $("#rr").checked, $("#tl2").checked);
        st = null;
      }
      $("#bx").onclick = () => finishCrop(true);
      $("#bf").onclick = () => finishCrop(false);
      $("#bc").onclick = () => {
        $("#md").hidden = true;
        st = null;
      };
      function readFile(f) {
        const r = new FileReader();
        r.onload = () => openCrop(r.result);
        r.readAsDataURL(f);
      }
      document.addEventListener("paste", (ev) => {
        if (/INPUT|TEXTAREA/.test(ev.target.tagName)) return;
        const it = [...(ev.clipboardData?.items || [])].find((i) =>
          i.type.startsWith("image/"),
        );
        if (it) {
          ev.preventDefault();
          readFile(it.getAsFile());
          return;
        }
        if (clip) {
          snap();
          const m = {},
            c = clip.n.map((n) => {
              const o = JSON.parse(JSON.stringify(n));
              m[n.id] = o.id = uid();
              o.x += 30;
              o.y += 30;
              return o;
            });
          S.nodes.push(...c);
          clip.e
            .filter((e) => m[e.a] && m[e.b])
            .forEach((e) =>
              S.edges.push({ ...e, id: uid(), a: m[e.a], b: m[e.b] }),
            );
          sel = c.map((n) => n.id);
          draw();
          panel();
        }
      });
      svg.ondragover = (ev) => ev.preventDefault();
      svg.ondrop = (ev) => {
        ev.preventDefault();
        const f = ev.dataTransfer.files[0];
        if (f && f.type.startsWith("image/")) readFile(f);
      };
      $("#up").onclick = () => $("#fi").click();
      $("#fi").onchange = (ev) => {
        if (ev.target.files[0]) readFile(ev.target.files[0]);
        ev.target.value = "";
      };
      /* ---------- export / persist ---------- */
      const DEFS =
        '<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>';
      let UNIT = "px",
        LK = false;
      const sizeCtl = (n) => {
        const u = UNIT == "cm",
          f = (v) => (u ? (v / 37.795).toFixed(2) : Math.round(v)),
          i = (l, k) =>
            `<label>${l}<input type="number" data-k="${k}" value="${f(n[k])}" step="${u ? 0.1 : 1}"></label>`;
        return `<div class="g">${i("Lebar", "w")}${i("Tinggi", "h")}${i("X", "x")}${i("Y", "y")}</div><div class="g"><select data-k="unit"><option value="px"${u ? "" : " selected"}>px</option><option value="cm"${u ? " selected" : ""}>cm</option></select><label class="c"><input type="checkbox" data-k="lk" ${LK ? "checked" : ""}> Kunci rasio</label></div>`;
      };
      function isDark() {
        const t = document.documentElement.dataset.theme;
        return t
          ? t == "dark"
          : matchMedia("(prefers-color-scheme:dark)").matches;
      }
      function optNow() {
        return { grid: GS, theme: isDark() ? "dark" : "light" };
      }
      function applyOpt(o) {
        if (!o) return;
        if (typeof o.grid == "boolean") {
          GS = o.grid;
          $("#gt").classList.toggle("on", GS);
        }
        if (o.theme) document.documentElement.dataset.theme = o.theme;
      }
      const cssv = (n, f) =>
        getComputedStyle(document.documentElement).getPropertyValue(n).trim() ||
        f;
      function sceneSVG() {
        const b = bbox(),
          p = 30,
          x = b.x - p,
          y = b.y - p,
          w = b.w + 2 * p,
          h = b.h + 2 * p,
          bg = cssv("--cv", "#fff"),
          dot = cssv("--dot", "#cdd3df"),
          ink = cssv("--ink", "#1f2937");
        const g = GS
          ? `<defs><pattern id="gd" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="${dot}"/></pattern></defs><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#gd)"/>`
          : "";
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${w}" height="${h}">${DEFS}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${bg}"/>${g}${scene().split("var(--ink,#1f2937)").join(ink).split("var(--cv,#fff)").join(bg)}</svg>`;
      }
      function dl(blob, name) {
        try {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = name;
          a.click();
        } catch (e) {}
      }
      async function copyTxt(t, m) {
        try {
          await navigator.clipboard.writeText(t);
          toast(m);
        } catch (e) {
          toast("Clipboard diblokir browser");
        }
      }
      $("#xs").onclick = () => {
        const s = sceneSVG();
        dl(new Blob([s], { type: "image/svg+xml" }), "diagram.svg");
        copyTxt(s, "SVG disalin ke clipboard");
      };
      $("#xj").onclick = () => {
        const s = JSON.stringify({ ...S, opt: optNow() });
        dl(new Blob([s], { type: "application/json" }), "diagram.json");
        copyTxt(s, "JSON disalin ke clipboard");
      };
      $("#xp").onclick = () => {
        const im = new Image(),
          s = sceneSVG();
        im.onload = () => {
          const k = 2,
            c = document.createElement("canvas");
          c.width = im.width * k;
          c.height = im.height * k;
          const x = c.getContext("2d");
          x.scale(k, k);
          x.drawImage(im, 0, 0);
          c.toBlob(async (bl) => {
            dl(bl, "diagram.png");
            try {
              await navigator.clipboard.write([
                new ClipboardItem({ "image/png": bl }),
              ]);
              toast("PNG disalin ke clipboard");
            } catch (e) {
              toast("PNG diekspor");
            }
          });
        };
        im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
      };
      $("#xi").onclick = () => $("#fj").click();
      $("#fj").onchange = (ev) => {
        const f = ev.target.files[0];
        if (!f) return;
        f.text().then((t) => {
          try {
            const o = JSON.parse(t);
            if (!o.nodes) throw 0;
            snap();
            S = o;
            applyOpt(o.opt);
            sel = [];
            selE = null;
            fit();
            panel();
          } catch (e) {
            toast("File JSON tidak valid");
          }
        });
        ev.target.value = "";
      };
      function save() {
        try {
          localStorage.setItem(
            "dg2-doc",
            JSON.stringify({ ...S, opt: optNow() }),
          );
        } catch (e) {}
      }
      $("#xc").onclick = () => {
        if (S.nodes.length && !confirm("Kosongkan canvas?")) return;
        snap();
        S = { nodes: [], edges: [] };
        sel = [];
        selE = null;
        draw();
        panel();
      };
      $("#th").onclick = () => {
        document.documentElement.dataset.theme = isDark() ? "light" : "dark";
        save();
      };
      $("#bu").onclick = undo;
      $("#br").onclick = redo;
      $("#zi").onclick = () => zoom(1.2);
      $("#zo").onclick = () => zoom(1 / 1.2);
      $("#zf").onclick = fit;
      $("#t1").onclick = () => setTool("sel");
      $("#t2").onclick = () => setTool("hand");
      $("#t3").onclick = () => setTool(tool == "edge" ? "sel" : "edge");
      $("#gt").onclick = () => {
        GS = !GS;
        $("#gt").classList.toggle("on", GS);
        draw();
      };
      document.addEventListener("keyup", (ev) => {
        if (ev.key == " ") spc = false;
        if ([" ", "Control", "Meta"].includes(ev.key)) setTool(tool);
      });
      document.addEventListener("keydown", (ev) => {
        if (
          ["Control", "Meta"].includes(ev.key) ||
          (ev.key == " " && !/INPUT|TEXTAREA/.test(ev.target.tagName))
        )
          svg.style.cursor = "grab";
      });
      document.addEventListener("keydown", (ev) => {
        if (/INPUT|TEXTAREA/.test(ev.target.tagName) || !$("#md").hidden)
          return;
        const m = ev.ctrlKey || ev.metaKey,
          k = ev.key.toLowerCase();
        if (k == " ") {
          spc = true;
          ev.preventDefault();
        } else if (m && k == "z") {
          ev.preventDefault();
          ev.shiftKey ? redo() : undo();
        } else if (m && k == "y") {
          ev.preventDefault();
          redo();
        } else if (m && k == "d") {
          ev.preventDefault();
          dup();
        } else if (m && k == "c") {
          if (sel.length) {
            const s = new Set(sel);
            clip = {
              n: sel.map(nd).map((n) => JSON.parse(JSON.stringify(n))),
              e: S.edges
                .filter((e) => s.has(e.a) && s.has(e.b))
                .map((e) => ({ ...e })),
            };
          }
        } else if (m && k == "0") {
          ev.preventDefault();
          fit();
        } else if (m && k == "a") {
          ev.preventDefault();
          sel = S.nodes.map((n) => n.id);
          selE = null;
          draw();
          panel();
        } else if (k == "delete" || k == "backspace") {
          if (sel.length || selE) del();
        } else if (k == "escape") {
          setTool("sel");
          sel = [];
          selE = null;
          draw();
          panel();
        } else if (!m && k == "v") setTool("sel");
        else if (!m && k == "h") setTool("hand");
        else if (!m && k == "c") setTool(tool == "edge" ? "sel" : "edge");
        else if (k.startsWith("arrow") && sel.length) {
          ev.preventDefault();
          snap();
          const d = ev.shiftKey ? 10 : 1;
          sel.map(nd).forEach((n) => {
            if (k == "arrowleft") n.x -= d;
            if (k == "arrowright") n.x += d;
            if (k == "arrowup") n.y -= d;
            if (k == "arrowdown") n.y += d;
          });
          draw();
        }
      });
      /* ---------- init ---------- */

      try {
        const s = JSON.parse(localStorage.getItem("dg2-doc") || "null");
        if (s && s.nodes) {
          S = s;
          applyOpt(s.opt);
        }
      } catch (e) {}
      if (!S.nodes.length) {
        const mk = (t, x, y, text, o) =>
          Object.assign(
            {
              id: uid(),
              t,
              x,
              y,
              w: SH[t][1],
              h: SH[t][2],
              fill: "#ffffff",
              stroke: "#64748b",
              text,
              fs: 13,
              dash: false,
            },
            o || {},
          );
        const c = mk("cont", 0, 0, "HQ VPC", {
            w: 560,
            h: 230,
            fill: "none",
            stroke: "#7c3aed",
            dash: true,
            tc: "#7c3aed",
          }),
          a = mk("round", 40, 90, "Wazuh", {
            fill: "#e8f0ff",
            stroke: "#3b82f6",
          }),
          b = mk("round", 230, 90, "n8n", {
            fill: "#e8f0ff",
            stroke: "#3b82f6",
          }),
          d = mk("diamond", 410, 80, "Severity?"),
          t = mk("term", 640, 95, "Telegram", {
            w: 120,
            h: 50,
            fill: "#e0f2fe",
            stroke: "#0284c7",
          }),
          E = (x, y, tx) => ({
            id: uid(),
            a: x.id,
            pa: null,
            b: y.id,
            pb: null,
            style: "ortho",
            stroke: "#64748b",
            sw: 1.5,
            arrow: true,
            dash: false,
            text: tx || "",
          });
        S = {
          nodes: [c, a, b, d, t],
          edges: [E(a, b, "alert"), E(b, d), E(d, t, "high")],
        };
      }
      panel();
      draw();
      setTimeout(fit, 50);
    </script>
  </body>
</html>
